name: API Contract Check

on:
  pull_request:
    branches: [huma]
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - name: Skip breaking check if allowed
        if: ${{ contains(join(github.event.pull_request.labels.*.name, ','), 'allow-breaking-change') }}
        run: |
          echo "allow-breaking-change label present, skipping workflow."
          exit 0

      - uses: actions/checkout@v6
      - run: git fetch --depth=1 origin ${{ github.base_ref }}

      - run: scripts/generate-openapi-spec.sh

      - uses: oasdiff/oasdiff-action/breaking@v0.0.31
        with:
          base: "origin/${{ github.base_ref }}:api/openapi.yaml"
          revision: "api/openapi.generated.yaml"
          fail-on: true
