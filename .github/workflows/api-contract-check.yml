name: API Contract Check

on:
  pull_request:
    branches: [huma]
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Generate OpenAPI
        run: ./scripts/generate-openapi-spec.sh

      - name: Run oasdiff changelog action
        uses: oasdiff/oasdiff-action/changelog@main
        with:
          old-spec: api/openapi.yaml
          new-spec: api/openapi.generated.yaml
          fail-on-breaking: true
