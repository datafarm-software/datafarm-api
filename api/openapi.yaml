                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Bad Request
                                status: 400
                                detail: No Authorization Header Provided.
                "401":
                    description: Unauthorized
                    content:
