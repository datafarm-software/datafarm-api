                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
