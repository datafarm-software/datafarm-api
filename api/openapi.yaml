                  in: path
                  description: Device Id to get DataBoundary information from.
                  required: true
                  schema:
                    type: string
                    pattern: ^\w{1,30}$
                - name: queryField
                  in: query
                  description: One or more QueryFields to return. Specify "all" to return every field the client has access to. Multiple values are supported for those endpoints where the queryField is required as a URL query parameter. In that case clients can request eg. ?queryField="temperature"&queryField="humidity"
                  required: true
                  explode: true
                  schema:
                    type: array
                    description: One or more QueryFields to return. Specify "all" to return every field the client has access to. Multiple values are supported for those endpoints where the queryField is required as a URL query parameter. In that case clients can request eg. ?queryField="temperature"&queryField="humidity"
                    items:
                        type: string
                    maxItems: 20
                    uniqueItems: true
                - name: start
                  in: query
                  description: Client specified timestamps are treated as inclusive in returned data. Client can specify a start time in two formats. 1. Relative Format eg. '-[0-9]{1,3}mo|m|h|d'. In Relative Format a stop time is not required. 2. RFC3339 Format. Now a Stop time is required. Start cannot be older than 90 days.
                  required: true
                  explode: false
                  schema:
                    type: string
                    description: Client specified timestamps are treated as inclusive in returned data. Client can specify a start time in two formats. 1. Relative Format eg. '-[0-9]{1,3}mo|m|h|d'. In Relative Format a stop time is not required. 2. RFC3339 Format. Now a Stop time is required. Start cannot be older than 90 days.
                - name: stop
                  in: query
                  description: Client specified timestamps are treated as inclusive in returned data. If Start is in RFC3339 Format, Stop field is required. Stop time must be later than Start. Stop can only ever be in RFC3339 Format.
                  explode: false
                  schema:
                    type: string
                    description: Client specified timestamps are treated as inclusive in returned data. If Start is in RFC3339 Format, Stop field is required. Stop time must be later than Start. Stop can only ever be in RFC3339 Format.
                - name: timezone-return
                  in: query
                  description: Clients can specify a timezone for the returned SensorData. Supports IANA Timezone definitions eg. Africa/Johannesburg
                  explode: false
                  schema:
                    type: string
                    description: Clients can specify a timezone for the returned SensorData. Supports IANA Timezone definitions eg. Africa/Johannesburg
                    pattern: ^(|[a-zA-Z]+/[a-zA-Z]+)$
            requestBody:
                content: {}
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SensorData'
                        text/csv:
