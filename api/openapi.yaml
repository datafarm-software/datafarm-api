                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Unauthorized
                                status: 401
                                detail: Unknown user.
                "404": {}
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Internal Server Error
                                status: 500
                                detail: Internal error logging in.
            security:
                - basic: []
components:
    schemas:
        BatchDataBoundaryResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchDataBoundaryResponse.json
                    readOnly: true
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/DataBoundaryError'
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/DataBoundary'
            required:
                - results
                - errors
        BatchQueryFieldsResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchQueryFieldsResponse.json
                    readOnly: true
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/QueryFieldsError'
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/QueryFields'
            required:
                - results
                - errors
        BatchSensorDataRequest:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchSensorDataRequest.json
                    readOnly: true
                hardware:
                    type: array
                    items:
                        $ref: '#/components/schemas/Hardware'
                    maxItems: 5
                start:
                    type: string
                    description: Client specified timestamps are treated as inclusive in returned data. Client can specify a start time in two formats. 1. Relative Format eg. '-[0-9]{1,3}mo|m|h|d'. In Relative Format a stop time is not required. 2. RFC3339 Format. Now a Stop time is required. Start cannot be older than 90 days.
                stop:
                    type: string
                    description: Client specified timestamps are treated as inclusive in returned data. If Start is in RFC3339 Format, Stop field is required. Stop time must be later than Start. Stop can only ever be in RFC3339 Format.
                timezone-return:
                    type: string
                    description: Clients can specify a timezone for the returned SensorData. Supports IANA Timezone definitions eg. Africa/Johannesburg
                    pattern: ^(|[a-zA-Z]+/[a-zA-Z]+)$
            required:
                - hardware
                - start
        BatchSensorDataResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchSensorDataResponse.json
                    readOnly: true
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/SensorDataError'
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/SensorData'
            required:
                - results
                - errors
        DataBoundary:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/DataBoundary.json
                    readOnly: true
                deviceId:
                    type: string
                start:
                    type: string
                    format: date-time
                stop:
                    type: string
                    format: date-time
            required:
                - deviceId
                - start
                - stop
        DataBoundaryError:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                error:
                    type: string
            required:
                - deviceId
                - error
        ErrorDetail:
            type: object
            additionalProperties: false
            properties:
                location:
                    type: string
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                message:
                    type: string
                    description: Error message text
                value:
                    description: The value at the given location
        ErrorModel:
            type: object
            additionalProperties: false
            properties:
                detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                    examples:
                        - Property foo is required but is missing.
                errors:
                    type: array
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                    format: uri
                    examples:
                        - https://example.com/error-log/abc123
                status:
                    type: integer
                    description: HTTP status code
                    format: int64
                    examples:
                        - 400
                title:
                    type: string
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    examples:
                        - Bad Request
                type:
                    type: string
                    description: A URI reference to human-readable documentation for the error.
                    format: uri
                    default: about:blank
                    examples:
                        - https://example.com/errors/example
        Hardware:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                    pattern: ^[a-zA-Z0-9]{1,30}$
                queryFields:
                    type: array
                    description: One or more QueryFields to return. Specify "all" to return every field the client has access to. Multiple values are supported for those endpoints where the queryField is required as a URL query parameter. In that case clients can request eg. ?queryField="temperature"&queryField="humidity"
                    items:
                        type: string
                    maxItems: 20
                    uniqueItems: true
            required:
                - deviceId
                - queryFields
        QueryFields:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/QueryFields.json
                    readOnly: true
                deviceId:
                    type: string
                queryFields:
                    type: array
                    items:
                        type: string
            required:
                - deviceId
                - queryFields
        QueryFieldsError:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                error:
                    type: string
            required:
                - deviceId
                - error
        SensorData:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                sensorData:
                    type: object
                    additionalProperties:
                        type: number
                        format: double
                timestamp:
                    type: string
                    description: Timestamp will be in UTC timezone and RFC3339 Format.
                    format: date-time
            required:
                - deviceId
                - timestamp
                - sensorData
        SensorDataError:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                error:
                    type: string
            required:
                - deviceId
                - error
    securitySchemes:
        basic:
            type: http
            name: Authorization
            in: header
            scheme: basic
            bearerFormat: Basic
        bearer:
            type: http
            name: Authorization
            in: header
            scheme: bearer
            bearerFormat: JWT
