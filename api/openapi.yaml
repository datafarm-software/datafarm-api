components:
    schemas:
        BatchDeviceDataRequest:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                    pattern: ^[a-zA-Z0-9]{1,30}$
                queryFields:
                    type: array
                    items:
                        type: string
                start:
                    type: string
                stop:
                    type: string
            required:
                - deviceId
                - queryFields
                - start
        BatchDeviceDataResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchDeviceDataResponse.json
                    readOnly: true
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeviceDataError'
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeviceData'
            required:
                - results
                - errors
        BatchQueryFieldsResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/BatchQueryFieldsResponse.json
                    readOnly: true
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/QueryFieldsError'
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/QueryFields'
            required:
                - results
                - errors
        DeviceData:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                sensorData:
                    type: object
                    additionalProperties: {}
                timestamp:
                    type: string
                    format: date-time
            required:
                - deviceId
                - timestamp
                - sensorData
        DeviceDataError:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                error:
                    type: string
            required:
                - deviceId
                - error
        ErrorDetail:
            type: object
            additionalProperties: false
            properties:
                location:
                    type: string
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                message:
                    type: string
                    description: Error message text
                value:
                    description: The value at the given location
        ErrorModel:
            type: object
            additionalProperties: false
            properties:
                detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                    examples:
                        - Property foo is required but is missing.
                errors:
                    type: array
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                    format: uri
                    examples:
                        - https://example.com/error-log/abc123
                status:
                    type: integer
                    description: HTTP status code
                    format: int64
                    examples:
                        - 400
                title:
                    type: string
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    examples:
                        - Bad Request
                type:
                    type: string
                    description: A URI reference to human-readable documentation for the error.
                    format: uri
                    default: about:blank
                    examples:
                        - https://example.com/errors/example
        QueryFields:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/QueryFields.json
                    readOnly: true
                deviceId:
                    type: string
                queryFields:
                    type: array
                    items:
                        type: string
            required:
                - deviceId
                - queryFields
        QueryFieldsError:
            type: object
            additionalProperties: false
            properties:
                deviceId:
                    type: string
                error:
                    type: string
            required:
                - deviceId
                - error
