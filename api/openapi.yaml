    /device/{deviceId}/sensordata:
        get:
            tags:
                - GET
            summary: Get Sensor Data
            description: Clients can use this route to request data from a sensor using its device id.
            parameters:
                - name: deviceId
                  in: path
                  description: Device Id to request data from.
                  required: true
                  schema:
                    type: string
                    pattern: ^\w{1,30}$
                - name: queryField
                  in: query
                  description: 'If all QueryFields desired, set ?queryField=all. Multiple QueryFields supported using format: ?queryField=temperature&queryField=humidity.'
                  required: true
                  explode: true
                  schema:
                    type: array
                    description: 'If all QueryFields desired, set ?queryField=all. Multiple QueryFields supported using format: ?queryField=temperature&queryField=humidity.'
                    items:
                        type: string
                - name: start
                  in: query
                  description: User specified timestamps are treated as inclusive in returned data. Client can specify a start time in two formats. 1. Relative Format eg. '-[0-9]{1,3}mo|m|h|d'. In Relative Format a stop time is not required. 2. RFC3339 Format. Now a Stop time is required. Start cannot be older than 90 days.
                  required: true
                  explode: false
                  schema:
                    type: string
                    description: User specified timestamps are treated as inclusive in returned data. Client can specify a start time in two formats. 1. Relative Format eg. '-[0-9]{1,3}mo|m|h|d'. In Relative Format a stop time is not required. 2. RFC3339 Format. Now a Stop time is required. Start cannot be older than 90 days.
                - name: stop
                  in: query
                  description: User specified timestamps are treated as inclusive in returned data. If Start is in RFC3339 Format, Stop field is required. Stop can only ever be in RFC3339 Format.
                  explode: false
                  schema:
                    type: string
                    description: User specified timestamps are treated as inclusive in returned data. If Start is in RFC3339 Format, Stop field is required. Stop can only ever be in RFC3339 Format.
            requestBody:
                content: {}
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/DeviceData'
                        text/csv:
                            schema:
                                type: string
                                description: Clients are able to negotiate CSV formatted Sensor Data using the Accept header. Format of the CSV is dependent on the QueryFields associated with the DeviceId. Should there be any errors, clients can expect these to be included in the CSV.
                "204":
                    description: No SensorData for the requested time period.
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Bad Request
                                status: 400
                                detail: Invalid start time.
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Unauthorized
                                status: 401
                                detail: Unknown user.
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
