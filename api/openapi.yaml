paths:
    /batch/device/queryfields:
        post:
            tags:
                - POST
            summary: Batch Get DeviceId QueryFields
            description: Clients can use this route to request QueryFields from multiple device ids.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            description: deviceIds
                            items:
                                type: string
                                pattern: ^[a-zA-Z0-9]{1,30}$
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchQueryFieldsResponse'
                "400":
                    description: Bad Request
                    content:
                        application/json:
