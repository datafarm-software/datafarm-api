    /device/{deviceId}/sensordata:
        get:
            tags:
                - GET
            summary: Get Sensor Data
            description: Clients can use this route to request data from a sensor using its device id.
            parameters:
                - name: deviceId
                  in: path
                  description: Device Id to request data from.
                  required: true
                  schema:
                    type: string
                    pattern: ^\w{1,30}$
                - name: queryField
                  in: query
                  description: 'If all QueryFields desired, set ?queryField=all. Multiple QueryFields supported using format: ?queryField=temperature&queryField=humidity.'
                  required: true
                  explode: true
                  schema:
                    type: array
                    description: 'If all QueryFields desired, set ?queryField=all. Multiple QueryFields supported using format: ?queryField=temperature&queryField=humidity.'
                    items:
                        type: string
                - name: start
                  in: query
                  required: true
                  explode: false
                  schema:
                    type: string
                - name: stop
                  in: query
                  explode: false
                  schema:
                    type: string
            requestBody:
                content: {}
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/DeviceData'
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
