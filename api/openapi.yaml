                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Bad Request
                                status: 400
                                detail: No auth header provided.
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
